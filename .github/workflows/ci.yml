name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lib:
    name: unit · lib · consumer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: node e2e/consumer/check.mjs

  docs:
    name: docs build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: docs/.vitepress/dist
          retention-days: 1

  e2e:
    name: e2e · ${{ matrix.name }}
    needs: docs
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # axe and motion get their own runners: in series after the chromium sweep they took ~11 min
        include:
          - name: chromium
            browser: chromium
            run: node e2e/sweep.mjs chromium && node e2e/interact.mjs chromium && node e2e/blocks.mjs chromium
          - name: firefox
            browser: firefox
            run: node e2e/sweep.mjs firefox && node e2e/interact.mjs firefox && node e2e/blocks.mjs firefox
          - name: webkit
            browser: webkit
            run: node e2e/sweep.mjs webkit && node e2e/interact.mjs webkit
          - name: axe
            browser: chromium
            run: node e2e/axe.mjs
          - name: motion
            browser: chromium
            run: node e2e/motion.mjs
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: docs/.vitepress/dist
      - name: playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: cache playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-${{ matrix.browser }}
      - run: pnpm exec playwright install-deps ${{ matrix.browser }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install ${{ matrix.browser }}
      - name: ${{ matrix.name }}
        run: |
          pnpm exec vitepress preview docs --port 4173 &
          sleep 3
          ${{ matrix.run }}

  # which component demos look different from the previous commit: a report (job summary and a
  # `visual-diff` artifact with base / head / diff pictures), never a gate, since changing how
  # things look is often the point. No baseline images are stored; both builds are rendered here.
  visual:
    name: visual diff
    needs: docs
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release ') }}"
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: docs/.vitepress/dist
      - name: playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: cache playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-chromium
      - run: pnpm exec playwright install-deps chromium
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: build the previous commit
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD~1)
          fi
          echo "comparing against $base"
          git worktree add ../base "$base"
          cd ../base
          pnpm install --frozen-lockfile
          pnpm docs:build
      - name: compare
        run: |
          pnpm exec vitepress preview docs --port 4173 &
          (cd ../base && pnpm exec vitepress preview docs --port 4174) &
          sleep 5
          node e2e/visual.mjs http://localhost:4174 http://localhost:4173 visual-out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-diff
          path: visual-out
          retention-days: 14

  # the docs that passed every check go live; pull requests never deploy
  deploy:
    name: deploy · cloudflare pages
    needs: [lib, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency: deploy
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: dist
      - run: npx --yes wrangler@4 pages deploy dist --project-name blessing-ui --branch main --commit-hash ${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
