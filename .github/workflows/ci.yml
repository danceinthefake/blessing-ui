name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    name: unit · lib · consumer · docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: node e2e/consumer/check.mjs
      - run: pnpm docs:build
      - uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: docs/.vitepress/dist
          retention-days: 1

  e2e:
    name: e2e · ${{ matrix.browser }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: docs/.vitepress/dist
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: sweep + interact (+ axe, motion on chromium)
        run: |
          pnpm exec vitepress preview docs --port 4173 &
          sleep 3
          node e2e/sweep.mjs ${{ matrix.browser }}
          node e2e/interact.mjs ${{ matrix.browser }}
          if [ "${{ matrix.browser }}" = "chromium" ]; then node e2e/axe.mjs; node e2e/motion.mjs; fi

  # which component demos look different from the previous commit: a report (job summary and a
  # `visual-diff` artifact with base / head / diff pictures), never a gate, since changing how
  # things look is often the point. No baseline images are stored; both builds are rendered here.
  visual:
    name: visual diff
    needs: build
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: docs/.vitepress/dist
      - run: pnpm exec playwright install --with-deps chromium
      - name: build the previous commit
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD~1)
          fi
          echo "comparing against $base"
          git worktree add ../base "$base"
          cd ../base
          pnpm install --frozen-lockfile
          pnpm build
          pnpm docs:build
      - name: compare
        run: |
          pnpm exec vitepress preview docs --port 4173 &
          (cd ../base && pnpm exec vitepress preview docs --port 4174) &
          sleep 5
          node e2e/visual.mjs http://localhost:4174 http://localhost:4173 visual-out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-diff
          path: visual-out
          retention-days: 14

  # the docs that passed every e2e job go live; pull requests never deploy
  deploy:
    name: deploy · cloudflare pages
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency: deploy
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: dist
      - run: npx --yes wrangler@4 pages deploy dist --project-name blessing-ui --branch main --commit-hash ${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
