name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    name: unit · lib · consumer · docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: node e2e/consumer/check.mjs
      - run: pnpm docs:build
      - uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: docs/.vitepress/dist
          retention-days: 1

  e2e:
    name: e2e · ${{ matrix.browser }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: docs/.vitepress/dist
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: sweep + interact (+ axe, motion on chromium)
        run: |
          pnpm exec vitepress preview docs --port 4173 &
          sleep 3
          node e2e/sweep.mjs ${{ matrix.browser }}
          node e2e/interact.mjs ${{ matrix.browser }}
          if [ "${{ matrix.browser }}" = "chromium" ]; then node e2e/axe.mjs; node e2e/motion.mjs; fi

  # the docs that passed every e2e job go live; pull requests never deploy
  deploy:
    name: deploy · cloudflare pages
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency: deploy
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: dist
      - run: npx --yes wrangler@4 pages deploy dist --project-name blessing-ui --branch main --commit-hash ${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
