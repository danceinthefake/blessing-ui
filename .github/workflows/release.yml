name: release
# push a v* tag -> stage the version on npm (trusted publishing, no token) + GitHub release.
# The trusted publisher may only *stage*: the version waits, private, until a person approves it
# with 2FA (npmjs.com/package/blessing-ui, or `npm stage list` / `npm stage approve <id>`).
on:
  push:
    tags: ["v*"]
permissions:
  contents: write # gh release create
  id-token: write # npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{p = index($0, "## " v " ") == 1; next} p' CHANGELOG.md > notes.md
          test -s notes.md
      # prepublishOnly runs pnpm test && pnpm build
      - run: npm stage publish --provenance --access public
      - name: say what is left to do
        run: |
          {
            echo "### ${GITHUB_REF_NAME} is staged, not published yet"
            echo
            echo "Approve it with 2FA at https://www.npmjs.com/package/blessing-ui, or run \`npm stage list\` and \`npm stage approve <id>\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - run: gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
