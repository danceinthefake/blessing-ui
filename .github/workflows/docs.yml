name: docs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: node e2e/consumer/check.mjs
      - run: pnpm docs:build # served at / for the sweep; DOCS_BASE only matters for Pages
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: cross-browser sweep (page errors) + axe
        run: |
          pnpm exec vitepress preview docs --port 4173 &
          sleep 3
          node e2e/sweep.mjs chromium,firefox,webkit
          node e2e/axe.mjs
          node e2e/interact.mjs chromium
          node e2e/interact.mjs firefox
          node e2e/interact.mjs webkit
      # Pages deploy disabled for now — re-add upload-pages-artifact + deploy-pages when ready
